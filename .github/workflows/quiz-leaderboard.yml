name: Actualitza el rànquing del quiz

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python QuizTaulaPeriodica/tools/update_leaderboard.py
      - name: Desa les marques si han canviat
        run: |
          git add QuizTaulaPeriodica/leaderboard.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Actualitza el rànquing del quiz'
          git push
